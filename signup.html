<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign up Page</title>
</head>

<body>
    <h1 style="text-align: center; font-size: 69px">Sign up for Tofu club!</h1>
    <p style="text-align: center"><em>What is Tofu club?</em></p>
    <p style="text-align: center">Tofu club takes place Tuesdays weekly in the garden! We share cultural tofu dishes at every meeting!</p>
    
    <div>
    <p style="background-color: antiquewhite">Interested in signing up?</p>
    <label>First Name</label> <br>
    <input type="text" placeholder="First Name">
    <br>
    <br>
    <br>
    <label>Last Name</label><br>
    <input type="text" placeholder="Last Name">
    <br>
    <br>
    <br>
    <label>Email</label><br>
    <input type="email" placeholder="Email">
    <br>
    <br>
    <br>
    <label>How do you like your tofu?</label><br>
    <select>
        <option value="Select">Select...</option>
        <option value="Silky">Silky</option>
        <option value="Smooth">Smooth</option>
        <option value="Firm">Firm</option>
        <option value="All of the above!">All of the above!</option>
    </select>
    <br>
    <br>
    <br>
</div>
    <input type="submit" text="I'm ready to join!">
</body>
</html>
